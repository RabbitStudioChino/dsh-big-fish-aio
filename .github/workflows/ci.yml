name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify committed client
        run: git diff --exit-code -- client.js
      - name: Check Python syntax without creating bytecode
        run: python3 -c "import ast,pathlib; ast.parse(pathlib.Path('modules/qq/tools/asr_cli.py').read_text(encoding='utf-8'))"
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks CLI
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history and current tracked files
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact=100 --log-opts=--all
          mkdir "$RUNNER_TEMP/public-tree"
          git checkout-index --all --prefix="$RUNNER_TEMP/public-tree/"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/public-tree" --redact=100
